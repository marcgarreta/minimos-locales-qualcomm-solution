# Solo en la Wi-Fi del Arduino
interface=wlan0
except-interface=lo
bind-dynamic
no-resolv
no-hosts
user=root

# Portal cautivo: cualquier dominio apunta al Arduino
address=/#/192.168.4.1

# DHCP para los clientes de Edu-Wifi
dhcp-authoritative
dhcp-range=192.168.4.10,192.168.4.254,255.255.255.0,1h
dhcp-option=option:router,192.168.4.1
dhcp-option=option:dns-server,192.168.4.1
# RFC 8910: anuncia el portal a moviles modernos
dhcp-option=114,"http://192.168.4.1/"
dhcp-leasefile=/var/lib/misc/dnsmasq.leases

log-facility=-
log-dhcp
